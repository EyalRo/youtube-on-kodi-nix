name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Build the package
        run: nix build .#default
      - name: Unit tests (Kodi stubbed)
        run: python3 -m unittest discover -s tests
      - name: End-to-end tests (real Kodi, headless)
        run: nix run .#e2e

  # Compile the appliance here, once, and publish it as the `latest` release; the NUC fetches
  # these binaries (appliance/prebuilt.nix) instead of building from source.
  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            appliance
            appliance/ui
      - name: System libraries the UI links against
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libxkbcommon-dev libinput-dev \
            libudev-dev libgbm-dev libseat-dev libgl-dev libmpv-dev libwayland-dev
      # Debug logs compiled in, as the appliance runs today (see appliance/package.nix).
      - name: Back end tests and build
        working-directory: appliance
        env:
          RUSTFLAGS: --cfg appliance_debug
        run: |
          cargo test --release --locked
          cargo build --release --locked
      - name: UI tests and build
        working-directory: appliance/ui
        env:
          RUSTFLAGS: --cfg appliance_debug
        run: |
          cargo test --release --locked
          cargo build --release --locked
      - name: Package
        run: |
          d=dist/appliance
          mkdir -p $d/backend/bin $d/ui/bin
          for b in mediad ytsync artsync kodi-import play; do
            install -m755 appliance/target/release/$b $d/backend/bin/
          done
          for b in appliance-ui fbsplash; do
            install -m755 appliance/ui/target/release/$b $d/ui/bin/
          done
          install -m755 appliance/ui/session.sh $d/ui/session.sh
          strip $d/backend/bin/* $d/ui/bin/*
          tar -C dist -czf appliance-x86_64-linux.tar.gz appliance
          # The version the UI compares itself against (see services.media-appliance.updateCheck).
          sed -n 's/^version = "\(.*\)"/\1/p' appliance/Cargo.toml | head -n1 > VERSION
      - name: Publish as `latest`
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest appliance-x86_64-linux.tar.gz VERSION --target "$GITHUB_SHA" \
            --title "latest" --notes "Appliance binaries built from $GITHUB_SHA."
